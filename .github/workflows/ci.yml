# The package's CI: glitchr-studio/ci's reusable workflow (the PHP 8.4 image, the package installed
# alone, PHPUnit, PHPStan against phpstan-baseline.neon, a consumer install without require-dev).
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:
  # release.yml runs this CI on a tag before the release.
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@133c7eda3cd536a2e3478474ead380257375589e # main, 2026-11-09
    with:
      smoke-class: 'Git\GitBundle'
