# A release on a pushed tag vX.Y.Z: this package's own CI on the tagged commit (ci.yml, called), then
# glitchr-studio/ci's release workflow, pinned: the tag checked as a version and against the branch alias,
# the notes from CHANGELOG.md, the source archive and its provenance, the GitHub release, Packagist told
# when the repository holds PACKAGIST_USERNAME/PACKAGIST_TOKEN. How to release: glitchr-studio/ci's
# docs/releasing.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: glitchr-studio/ci/.github/workflows/php-release.yml@133c7eda3cd536a2e3478474ead380257375589e # main, 2026-11-09
    secrets: inherit
